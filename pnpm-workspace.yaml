packages:
  - "apps/*"
  - "packages/*"

# Build-script approval policy (pnpm 11 `allowBuilds` map).
# true = run postinstall, false = skip (and never warn/prompt).
allowBuilds:
  esbuild: true
  "@prisma/client": false
  better-sqlite3: false
  '@swc/core': true

minimumReleaseAgeExclude:
  - lucide-react@1.44.0
