# CandidLens — one-command self-host.
#
#   cp .env.example .env   # set BETTER_AUTH_SECRET (required)
#   docker compose up --build -d   # Docker Compose 2.24 or newer
#   → web  http://localhost:3000
#   → api  http://localhost:4000/api/health
#
# Dev note: `docker compose up -d postgres` still starts just the
# database for local `pnpm dev` workflows, as documented in
# docs/project_execution.md.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hirelens-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hirelens
    ports:
      - "5433:5432"
    volumes:
      - hirelens_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hirelens"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hirelens-api
    depends_on:
      postgres:
        condition: service_healthy
    # The API reads every setting in the root .env, so the optional ones
    # need no line here: the model failover chain (CANDIDLENS_LLM_FALLBACKS
    # with CANDIDLENS_LLM_<ID>_MODEL / _API_KEY / _BASE_URL), the retry
    # deadline (CANDIDLENS_LLM_DEADLINE_MS) and email (CANDIDLENS_SMTP_*,
    # CANDIDLENS_MAIL_FROM), under their old HIRELENS_* names too. The
    # entries under `environment` win over the file.
    env_file:
      - path: .env
        required: false
    environment:
      # The image's own values, whatever a development .env says.
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hirelens
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173}
      # OAuth (Better Auth social providers) — optional; buttons hide when unset.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # LLM — optional; scoring/derive return 503 when unset.
      CANDIDLENS_LLM_PROVIDER: ${CANDIDLENS_LLM_PROVIDER:-}
      CANDIDLENS_LLM_MODEL: ${CANDIDLENS_LLM_MODEL:-}
      CANDIDLENS_LLM_API_KEY: ${CANDIDLENS_LLM_API_KEY:-}
      CANDIDLENS_LLM_BASE_URL: ${CANDIDLENS_LLM_BASE_URL:-}
      # The old names still work: the API reads CANDIDLENS_* first and falls
      # back to these, so an existing .env needs no changes.
      HIRELENS_LLM_PROVIDER: ${HIRELENS_LLM_PROVIDER:-}
      HIRELENS_LLM_MODEL: ${HIRELENS_LLM_MODEL:-}
      HIRELENS_LLM_API_KEY: ${HIRELENS_LLM_API_KEY:-}
      HIRELENS_LLM_BASE_URL: ${HIRELENS_LLM_BASE_URL:-}
      # Observability — optional, all no-ops when unset.
      SENTRY_DSN: ${SENTRY_DSN:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_AUTH_BASE_URL: ${NEXT_PUBLIC_AUTH_BASE_URL:-http://localhost:4000}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED:-}
        NEXT_PUBLIC_GITHUB_OAUTH_ENABLED: ${NEXT_PUBLIC_GITHUB_OAUTH_ENABLED:-}
        # The web app can't see the API's SMTP settings, so it offers
        # "Forgot password?" and email confirmation only when this is true.
        NEXT_PUBLIC_EMAIL_ENABLED: ${NEXT_PUBLIC_EMAIL_ENABLED:-}
    environment:
      NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED:-}
      NEXT_PUBLIC_GITHUB_OAUTH_ENABLED: ${NEXT_PUBLIC_GITHUB_OAUTH_ENABLED:-}
      NEXT_PUBLIC_EMAIL_ENABLED: ${NEXT_PUBLIC_EMAIL_ENABLED:-}
    container_name: hirelens-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  hirelens_pgdata:
