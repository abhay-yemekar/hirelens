services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hirelens-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hirelens
    ports:
      - "5433:5432"
    volumes:
      - hirelens_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hirelens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hirelens_pgdata:
